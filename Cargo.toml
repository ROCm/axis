[workspace]
resolver = "2"
exclude = ["gui/linux"]
members = [
    "crates/axis-core",
    "crates/axis-safety",
    "crates/axis-sandbox",
    "crates/axis-proxy",
    "crates/axis-router",
    "crates/axis-gpu",
    "crates/axis-pty",
    "crates/axis-gateway",
    "crates/axis-daemon",
    "crates/axis-cli",
    "benches",
]

[workspace.package]
version = "0.3.5"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ROCm/axis"

[workspace.dependencies]
# Internal crates
axis-core = { path = "crates/axis-core" }
axis-safety = { path = "crates/axis-safety" }
axis-sandbox = { path = "crates/axis-sandbox" }
axis-proxy = { path = "crates/axis-proxy" }
axis-router = { path = "crates/axis-router" }
axis-gpu = { path = "crates/axis-gpu" }
axis-daemon = { path = "crates/axis-daemon" }
axis-pty = { path = "crates/axis-pty" }
axis-gateway = { path = "crates/axis-gateway" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Policy engine
regorus = "0.12"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Crypto
sha2 = "0.11"

# HTTP
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
httparse = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"

# Pattern matching (leak detection)
aho-corasick = "1"
regex = "1"

# Filesystem watching
notify = "8.2"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Linux syscalls
nix = { version = "0.31", features = ["process", "sched", "signal", "user", "net", "mount"] }
libc = "0.2"

# Temp directories
tempfile = "3"

# WebSocket
tokio-tungstenite = "0.29"

# Crypto (for WebSocket handshake)
sha1 = "0.11"
base64 = "0.23"

# LLM inference (llama.cpp via Rust bindings)
llama-cpp-2 = "0.1"

# HuggingFace model download
indicatif = "0.18"
