name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "315532800"
  RUST_TOOLCHAIN: 1.95.0
  CARGO_DEB_VERSION: 3.6.4
  CARGO_GENERATE_RPM_VERSION: 0.21.0
  MXC_REPOSITORY: https://github.com/microsoft/mxc
  MXC_REF: 1736b48398c3fe4d1315b2311c0951cc893eb3ae
  SYFT_VERSION: 1.46.0
  SYFT_LINUX_AMD64_SHA256: d654f678b709eb53c393d38519d5ed7d2e57205529404018614cfefa0fb2b5ca

jobs:
  identity:
    name: Verify release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install release process supervisor
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 install -y bubblewrap
          if ! bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- true; then
            userns_restriction="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
            test "$userns_restriction" = "1"
            printf '%s\n' "$userns_restriction" > "$RUNNER_TEMP/axis-release-apparmor-userns"
            sudo -n sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- true
      - name: Bind tag, version, and commit
        run: >-
          python3 scripts/release_tools.py verify-identity
          --repository-root .
          --tag "$GITHUB_REF_NAME"
          --sha "$GITHUB_SHA"
      - name: Restore release process supervisor
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/axis-release-apparmor-userns"
          if [ -f "$state" ]; then
            sudo -n sysctl -q -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$state")"
            rm -f "$state"
          fi

  gate:
    name: Verify required workflow results
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read # inspect required workflow results for the exact release commit
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install release process supervisor
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 install -y bubblewrap
          if ! bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- true; then
            userns_restriction="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
            test "$userns_restriction" = "1"
            printf '%s\n' "$userns_restriction" > "$RUNNER_TEMP/axis-release-apparmor-userns"
            sudo -n sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- true
      - name: Require successful CI and security runs for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release_tools.py verify-workflows
          --repository "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA"
          --workflow ci.yml
          --workflow security.yml
      - name: Restore release process supervisor
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/axis-release-apparmor-userns"
          if [ -f "$state" ]; then
            sudo -n sysctl -q -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$state")"
            rm -f "$state"
          fi

  gui:
    name: GUI release artifacts
    needs: [identity, gate]
    uses: ./.github/workflows/gui-release.yml
    permissions:
      contents: read

  build:
    name: Build (${{ matrix.target }})
    needs: [identity, gate]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive: tar.gz
            platform: linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            platform: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
            platform: windows-x86_64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          rustup default "$RUST_TOOLCHAIN"

      - name: Install Rust toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$env:RUST_TOOLCHAIN" --profile minimal --target "$env:TARGET"
          rustup default "$env:RUST_TOOLCHAIN"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$env:TARGET"

      - name: Compare independent clean Linux core build
        if: matrix.platform == 'linux-x86_64'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir "$RUNNER_TEMP/axis-first-build"
          cp "target/$TARGET/release/axis" "target/$TARGET/release/axisd" \
            "target/$TARGET/release/axis-seccomp-launcher" \
            "target/$TARGET/release/axis-netns-helper" "$RUNNER_TEMP/axis-first-build/"
          cargo clean --target "$TARGET"
          cargo build --locked --release --target "$TARGET"
          for binary in axis axisd axis-seccomp-launcher axis-netns-helper; do
            cmp "$RUNNER_TEMP/axis-first-build/$binary" "target/$TARGET/release/$binary"
          done

      - name: Build MXC Windows executor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mxcDir = Join-Path $env:RUNNER_TEMP "mxc"
          git clone --filter=blob:none $env:MXC_REPOSITORY $mxcDir
          git -C $mxcDir checkout $env:MXC_REF
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "third_party\mxc\patches\*.patch") |
            Sort-Object Name | ForEach-Object { git -C $mxcDir apply --whitespace=error $_.FullName }
          Push-Location (Join-Path $mxcDir "src")
          cargo build --release -p wxc --no-default-features --locked --target ${{ matrix.target }}
          Pop-Location
          Copy-Item (Join-Path $mxcDir "src\target\${{ matrix.target }}\release\wxc-exec.exe") target\${{ matrix.target }}\release\wxc-exec.exe

      - name: Build MXC Linux executor
        if: matrix.platform == 'linux-x86_64'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mxc_dir="$(mktemp -d "$RUNNER_TEMP/mxc-XXXXXX")"
          git clone --filter=blob:none "$MXC_REPOSITORY" "$mxc_dir"
          git -C "$mxc_dir" checkout "$MXC_REF"
          cargo build --release --manifest-path "$mxc_dir/src/Cargo.toml" -p lxc --no-default-features --locked
          cp "$mxc_dir/src/target/release/lxc-exec" "$RUNNER_TEMP/lxc-exec.first"
          cargo clean --manifest-path "$mxc_dir/src/Cargo.toml"
          cargo build --release --manifest-path "$mxc_dir/src/Cargo.toml" -p lxc --no-default-features --locked
          cmp "$RUNNER_TEMP/lxc-exec.first" "$mxc_dir/src/target/release/lxc-exec"
          cp "$mxc_dir/src/target/release/lxc-exec" "target/$TARGET/release/lxc-exec"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          package_dir="dist/axis-$PLATFORM"
          target_dir="target/$TARGET/release"
          mkdir -p "$package_dir"
          cp "$target_dir/axis" "$package_dir/"
          cp "$target_dir/axisd" "$package_dir/"
          if [ "$PLATFORM" = "linux-x86_64" ]; then
            cp "$target_dir/lxc-exec" "$package_dir/"
            cp "$target_dir/axis-seccomp-launcher" "$package_dir/"
            cp "$target_dir/axis-netns-helper" "$package_dir/"
          fi
          cp policies/*.yaml "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          cp "packaging/reproducibility/core-${PLATFORM%%-*}.json" "$package_dir/REPRODUCIBILITY.json"
          if [ "$PLATFORM" = "linux-x86_64" ]; then
            cp packaging/runtime/core-linux.json "$package_dir/RUNTIME_DEPENDENCIES.json"
          fi
          cd dist
          archive_root="axis-$PLATFORM"
          find "$archive_root" -exec touch -t 198001010000 {} +
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
              -cf - "$archive_root" | gzip -n > "$archive_root.tar.gz"
          else
            COPYFILE_DISABLE=1 find "$archive_root" -print | LC_ALL=C sort | \
              tar -T - --no-recursion --uid 0 --gid 0 --uname root --gname root \
              -cf - | gzip -n > "$archive_root.tar.gz"
          fi
          cp "$archive_root.tar.gz" "$archive_root.first.tar.gz"
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
              -cf - "$archive_root" | gzip -n > "$archive_root.tar.gz"
          else
            COPYFILE_DISABLE=1 find "$archive_root" -print | LC_ALL=C sort | \
              tar -T - --no-recursion --uid 0 --gid 0 --uname root --gname root \
                -cf - | gzip -n > "$archive_root.tar.gz"
          fi
          cmp "$archive_root.first.tar.gz" "$archive_root.tar.gz"
          rm "$archive_root.first.tar.gz"

      - name: Verify Unix release archive
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archive="dist/axis-$PLATFORM.tar.gz"
          archive_root="axis-$PLATFORM"
          required=(--require axis --require axisd)
          required+=(--require REPRODUCIBILITY.json)
          if [ "$PLATFORM" = "linux-x86_64" ]; then
            required+=(--require lxc-exec --require axis-seccomp-launcher --require axis-netns-helper --require RUNTIME_DEPENDENCIES.json)
            tar tzf "$archive" | grep -F "$archive_root/lxc-exec"
            tar tzf "$archive" | grep -F "$archive_root/axis-seccomp-launcher"
          fi
          python3 scripts/verify_release_archive.py "$archive" "$archive_root" "${required[@]}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          $platform = "$env:PLATFORM"
          $target = "$env:TARGET"
          $packageDir = Join-Path "dist" "axis-$platform"
          $targetDir = Join-Path (Join-Path "target" "$target") "release"
          New-Item -ItemType Directory -Path "$packageDir" -Force
          Copy-Item -LiteralPath (Join-Path "$targetDir" "axis.exe") -Destination "$packageDir"
          Copy-Item -LiteralPath (Join-Path "$targetDir" "axisd.exe") -Destination "$packageDir"
          Copy-Item -LiteralPath (Join-Path "$targetDir" "wxc-exec.exe") -Destination "$packageDir"
          Copy-Item -LiteralPath (Join-Path "$targetDir" "axis-wfp-broker.exe") -Destination "$packageDir"
          Copy-Item -LiteralPath (Join-Path "$targetDir" "axis-ssh-proxy.exe") -Destination "$packageDir"
          Copy-Item -LiteralPath "scripts/install_windows_wfp_broker.ps1" -Destination "$packageDir"
          Copy-Item -Path "policies\*.yaml" -Destination "$packageDir"
          Copy-Item -LiteralPath "README.md" -Destination "$packageDir"
          Copy-Item -LiteralPath "LICENSE" -Destination "$packageDir"
          Copy-Item -LiteralPath "install.ps1" -Destination "$packageDir"
          Copy-Item -LiteralPath "packaging/reproducibility/core-windows.json" -Destination (Join-Path "$packageDir" "REPRODUCIBILITY.json")
          Add-Type -AssemblyName System.IO.Compression
          $source = (Resolve-Path -LiteralPath "$packageDir").Path
          $archive = Join-Path (Split-Path "$source" -Parent) "axis-$platform.zip"
          $root = Split-Path $source -Parent
          $zip = [System.IO.Compression.ZipFile]::Open(
            $archive,
            [System.IO.Compression.ZipArchiveMode]::Create
          )
          try {
            Get-ChildItem -LiteralPath $source -File -Recurse | Sort-Object FullName | ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/')
              $entry = $zip.CreateEntry($relative, [System.IO.Compression.CompressionLevel]::Optimal)
              $entry.LastWriteTime = [System.DateTimeOffset]::new(1980, 1, 1, 0, 0, 0, [TimeSpan]::Zero)
              $input = [System.IO.File]::OpenRead($_.FullName)
              $output = $entry.Open()
              try { $input.CopyTo($output) } finally { $output.Dispose(); $input.Dispose() }
            }
          } finally {
            $zip.Dispose()
          }

      - name: Verify Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PLATFORM: ${{ matrix.platform }}
        run: >-
          python scripts/verify_release_archive.py
          "dist/axis-$env:PLATFORM.zip"
          "axis-$env:PLATFORM"
          --require axis.exe
          --require axisd.exe
          --require wxc-exec.exe
          --require axis-wfp-broker.exe
          --require axis-ssh-proxy.exe
          --require install_windows_wfp_broker.ps1
          --require REPRODUCIBILITY.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axis-${{ matrix.platform }}
          path: dist/axis-${{ matrix.platform }}.${{ matrix.archive }}

  # Build native packages for Linux.
  package-linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build release
        run: cargo build --locked --release

      - name: Build MXC Linux executor
        run: |
          mxc_dir="$(mktemp -d "$RUNNER_TEMP/mxc-XXXXXX")"
          git clone --filter=blob:none "$MXC_REPOSITORY" "$mxc_dir"
          git -C "$mxc_dir" checkout "$MXC_REF"
          cargo build --release --manifest-path "$mxc_dir/src/Cargo.toml" -p lxc --no-default-features --locked
          cp "$mxc_dir/src/target/release/lxc-exec" target/release/lxc-exec

      - name: Build .deb
        run: |
          cargo install cargo-deb --version "$CARGO_DEB_VERSION" --locked
          cargo deb -p axis-daemon --no-build

      - name: Verify .deb contents
        run: |
          deb="$(find target/debian -name '*.deb' -print -quit)"
          test -n "$deb"
          scripts/verify_linux_package_manifest.sh deb "$deb"

      - name: Build .rpm
        run: |
          cargo install cargo-generate-rpm --version "$CARGO_GENERATE_RPM_VERSION" --locked
          cargo generate-rpm -p crates/axis-daemon

      - name: Verify .rpm contents
        run: |
          rpm_path="$(find target/generate-rpm -name '*.rpm' -print -quit)"
          test -n "$rpm_path"
          scripts/verify_linux_package_manifest.sh rpm "$rpm_path"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  sbom:
    name: Generate release SBOMs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [build, package-linux, gui]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: axis-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: artifacts/linux-packages

      - name: Prepare pinned MXC SBOM manifests
        run: |
          mxc_dir="$RUNNER_TEMP/mxc-sbom"
          git clone --filter=blob:none --no-checkout "$MXC_REPOSITORY" "$mxc_dir"
          git -C "$mxc_dir" checkout --detach "$MXC_REF"
          echo "MXC_SBOM_DIR=$mxc_dir" >> "$GITHUB_ENV"

      - name: Install checksum-verified Syft
        run: |
          set -euo pipefail
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/$archive"
          echo "$SYFT_LINUX_AMD64_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/syft"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/syft" syft
          echo "$RUNNER_TEMP/syft" >> "$GITHUB_PATH"

      - name: Generate and verify dependency-backed SPDX SBOMs
        run: >-
          scripts/generate_release_sboms.sh
          artifacts sbom "$GITHUB_SHA" "$MXC_SBOM_DIR" "$MXC_REF"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axis-sboms
          path: sbom/*.spdx.json

  checksums:
    name: Generate release checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [build, package-linux, gui, sbom]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: axis-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: artifacts/linux-packages
      - name: Create one SHA-256 sidecar per release artifact
        run: |
          set -euo pipefail
          mkdir checksums
          while IFS= read -r -d '' artifact; do
            name="$(basename "$artifact")"
            sidecar="checksums/$name.sha256"
            if [ -e "$sidecar" ]; then
              echo "duplicate release asset name: $name" >&2
              exit 1
            fi
            sha256sum "$artifact" | awk -v name="$name" '{print $1 "  " name}' > "$sidecar"
          done < <(find artifacts -type f -print0)
          test -n "$(find checksums -type f -name '*.sha256' -print -quit)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: checksums/*.sha256

  attest:
    name: Attest release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [gate, build, package-linux, gui, sbom, checksums]
    permissions:
      contents: read
      id-token: write # mint a short-lived identity for provenance signing
      attestations: write # store signed provenance for the release subjects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: axis-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: artifacts/linux-packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: artifacts/release-checksums
      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
      - name: Assemble and verify attestation subjects
        run: |
          mkdir attest-assets
          while IFS= read -r -d '' asset; do
            destination="attest-assets/$(basename "$asset")"
            test ! -e "$destination" || {
              echo "duplicate release asset name: $(basename "$asset")" >&2
              exit 1
            }
            cp "$asset" "$destination"
          done < <(find artifacts -type f -print0)
          scripts/verify_release_assets.sh stable attest-assets "$GITHUB_SHA"
      - name: Generate build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: attest-assets/*

  # Create GitHub release with all artifacts.
  release:
    name: Create Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [gate, build, package-linux, gui, sbom, checksums, attest]
    permissions:
      actions: read # revalidate required workflow results immediately before publication
      contents: write # create the tagged GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install release process supervisor
        timeout-minutes: 5
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 install -y bubblewrap
          if ! bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- true; then
            userns_restriction="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
            test "$userns_restriction" = "1"
            printf '%s\n' "$userns_restriction" > "$RUNNER_TEMP/axis-release-apparmor-userns"
            sudo -n sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: axis-*
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-packages
          path: artifacts/linux-packages
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: artifacts/release-checksums

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Revalidate required workflows immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release_tools.py verify-workflows
          --repository "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA"
          --workflow ci.yml
          --workflow security.yml

      - name: Create release from complete artifact set
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir publish-assets
          while IFS= read -r -d '' asset; do
            destination="publish-assets/$(basename "$asset")"
            test ! -e "$destination" || {
              echo "duplicate release asset name: $(basename "$asset")" >&2
              exit 1
            }
            cp "$asset" "$destination"
          done < <(find artifacts -type f -print0)
          scripts/publish_github_release.sh \
            stable "$RELEASE_TAG" publish-assets "$RELEASE_TAG"

      - name: Restore release process supervisor
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/axis-release-apparmor-userns"
          if [ -f "$state" ]; then
            sudo -n sysctl -q -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$state")"
            rm -f "$state"
          fi
