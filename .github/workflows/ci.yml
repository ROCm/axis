name: CI

on:
  push:
    branches: [main, develop, "users/**"]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "315532800"
  RUST_TOOLCHAIN: 1.95.0
  CARGO_DEB_VERSION: 3.6.4
  CARGO_GENERATE_RPM_VERSION: 0.21.0
  MXC_REPOSITORY: https://github.com/microsoft/mxc
  MXC_REF: 1736b48398c3fe4d1315b2311c0951cc893eb3ae

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Format and clippy always run (fast, catch style issues on all changes).
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: Check Rust formatting
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path gui/linux/Cargo.toml -- --check

  gui-release-validation:
    name: GUI release validation
    needs: changes
    uses: ./.github/workflows/gui-release.yml
    permissions:
      contents: read

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - run: cargo clippy --locked --all-targets -- -D warnings

  # Build and test jobs skip on docs-only changes.
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        id: filter
        with:
          token: ""
          filters: |
            code:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'e2e/linux/**'
              - 'gui/**'
              - 'install.sh'
              - 'install.ps1'
              - 'policies/**'
              - 'data/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - '.github/workflows/nightly.yml'
              - '.github/workflows/gui-release.yml'

  test-linux:
    name: Test (Linux)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install Linux sandbox dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 install -y bubblewrap python3 rpm
          if ! bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- true; then
            userns_restriction="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
            test "$userns_restriction" = "1"
            printf '%s\n' "$userns_restriction" > "$RUNNER_TEMP/axis-apparmor-userns"
            sudo -n sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- true

      - name: Build
        run: cargo build --locked --release

      - name: Build MXC Linux executor
        timeout-minutes: 15
        run: |
          mxc_dir="$(mktemp -d "$RUNNER_TEMP/mxc-XXXXXX")"
          git clone --filter=blob:none "$MXC_REPOSITORY" "$mxc_dir"
          git -C "$mxc_dir" checkout "$MXC_REF"
          cargo build --release --manifest-path "$mxc_dir/src/Cargo.toml" -p lxc --no-default-features --locked
          cp "$mxc_dir/src/target/release/lxc-exec" target/release/lxc-exec

      - name: Security Tier 0/1 tests
        run: bash scripts/test_security_tier0.sh

      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Unit & integration tests
        run: cargo test --locked

      - name: Seccomp notify connect attribution proof
        env:
          AXIS_TEST_SECCOMP_NOTIFY_ATTRIBUTION: "1"
        run: cargo test --locked -p axis-sandbox gated_seccomp_notify_records_connecting_executable_before_fd_handoff_exec -- --nocapture

      - name: Standalone Linux e2e test
        run: bash e2e/linux/test_sandbox.sh ./target/release/axis

      - name: Policy validation
        run: |
          ./target/release/axis policy validate policies/minimal.yaml
          ./target/release/axis policy validate policies/coding-agent.yaml
          ./target/release/axis policy validate policies/gpu-agent.yaml

      - name: Linux MXC packaging contract
        run: bash scripts/check_linux_mxc_packaging.sh

      - name: Assemble and install release archive without privileges
        run: |
          set -euo pipefail
          mkdir -p dist/axis-linux-x86_64
          cp target/release/axis target/release/axisd dist/axis-linux-x86_64/
          cp target/release/lxc-exec target/release/axis-seccomp-launcher \
            target/release/axis-netns-helper dist/axis-linux-x86_64/
          cp policies/*.yaml dist/axis-linux-x86_64/
          cp README.md LICENSE dist/axis-linux-x86_64/
          tar --sort=name --mtime='UTC 1980-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C dist axis-linux-x86_64 | gzip -n > dist/axis-linux-x86_64.tar.gz
          (cd dist && sha256sum axis-linux-x86_64.tar.gz > axis-linux-x86_64.tar.gz.sha256)
          install_root="$RUNNER_TEMP/axis-install"
          AXIS_INSTALL_ARCHIVE="$PWD/dist/axis-linux-x86_64.tar.gz" \
            sh install.sh --prefix "$install_root"
          test -x "$install_root/axis"
          test -x "$install_root/axisd"
          test -x "$install_root/lxc-exec"
          test -x "$install_root/axis-seccomp-launcher"
          test ! -e "$install_root/axis-netns-helper"

      - name: Build and inspect Linux native packages
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cargo install cargo-deb --version "$CARGO_DEB_VERSION" --locked
          cargo deb -p axis-daemon --no-build
          deb="$(find target/debian -name '*.deb' -print -quit)"
          test -n "$deb"
          scripts/verify_linux_package_manifest.sh deb "$deb"

          cargo install cargo-generate-rpm --version "$CARGO_GENERATE_RPM_VERSION" --locked
          cargo generate-rpm -p crates/axis-daemon
          rpm_path="$(find target/generate-rpm -name '*.rpm' -print -quit)"
          test -n "$rpm_path"
          scripts/verify_linux_package_manifest.sh rpm "$rpm_path"

      - name: Restore Linux user namespace restriction
        if: ${{ always() }}
        run: |
          state="$RUNNER_TEMP/axis-apparmor-userns"
          if [ -f "$state" ]; then
            sudo -n sysctl -q -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$state")"
            rm -f "$state"
          fi

      - name: Success metrics
        run: ./target/release/success-metrics

      - name: Daemon e2e test
        run: bash e2e/linux/test_e2e_daemon.sh

      - name: Agent safety tests
        env:
          AXIS_AGENT_TEST_RUNTIME_PROVIDER: axis_native
          AXIS_AGENT_TEST_DISABLE_RESOURCE_LIMITS: "1"
          AXIS_AGENT_TEST_NETWORK_MODE: block
        run: AXIS_BIN=./target/release/axis bash e2e/agents/test_agents.sh --platform linux

  test-macos:
    name: Test (macOS native)
    needs: changes
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build and test
        run: |
          cargo build --locked --release
          cargo test --locked

      - name: Validate bundled policies
        run: |
          target/release/axis policy validate policies/minimal.yaml
          target/release/axis policy validate policies/coding-agent.yaml
          target/release/axis policy validate policies/gpu-agent.yaml

      - name: Assemble and install macOS release archive
        run: |
          set -euo pipefail
          package_dir="dist/axis-macos-aarch64"
          mkdir -p "$package_dir"
          cp target/release/axis target/release/axisd "$package_dir/"
          cp policies/*.yaml "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          find "$package_dir" -exec touch -t 198001010000 {} +
          cd dist
          COPYFILE_DISABLE=1 find axis-macos-aarch64 -print | LC_ALL=C sort | \
            tar -T - --no-recursion --uid 0 --gid 0 --uname root --gname root \
              -cf - | gzip -n > axis-macos-aarch64.tar.gz
          sha256="$(shasum -a 256 axis-macos-aarch64.tar.gz | awk '{print $1}')"
          printf '%s  %s\n' "$sha256" axis-macos-aarch64.tar.gz \
            > axis-macos-aarch64.tar.gz.sha256
          install_root="$RUNNER_TEMP/axis-installed"
          AXIS_INSTALL_ARCHIVE="$PWD/axis-macos-aarch64.tar.gz" \
            AXIS_INSTALL_SHA256="$PWD/axis-macos-aarch64.tar.gz.sha256" \
            sh ../install.sh --prefix "$install_root"
          "$install_root/axis" --version
          test -x "$install_root/axisd"

  test-linux-netns-helper:
    name: Test Linux netns helper
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install kernel namespace tooling
        timeout-minutes: 5
        run: |
          timeout --kill-after=10s 200s sudo -n timeout --kill-after=10s 180s \
            apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 update
          timeout --kill-after=10s 200s sudo -n timeout --kill-after=10s 180s \
            apt-get -o Acquire::Retries=3 -o Dpkg::Use-Pty=0 install -y \
              bubblewrap iproute2 iptables libcap2-bin python3
          if ! timeout --kill-after=1s 5s bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- true; then
            userns_restriction="$(timeout --kill-after=1s 5s sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
            test "$userns_restriction" = "1"
            printf '%s\n' "$userns_restriction" > "$RUNNER_TEMP/axis-netns-helper-apparmor-userns"
            timeout --kill-after=1s 7s sudo -n timeout --kill-after=1s 5s sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          timeout --kill-after=1s 5s \
            bwrap --unshare-user --uid 0 --gid 0 --ro-bind / / -- true

      - name: Build MXC Linux executor
        timeout-minutes: 15
        run: |
          mkdir -p target/release
          mxc_dir="$(mktemp -d "$RUNNER_TEMP/mxc-XXXXXX")"
          git clone --filter=blob:none "$MXC_REPOSITORY" "$mxc_dir"
          git -C "$mxc_dir" checkout "$MXC_REF"
          cargo build --release --manifest-path "$mxc_dir/src/Cargo.toml" -p lxc --no-default-features --locked
          cp "$mxc_dir/src/target/release/lxc-exec" target/release/lxc-exec

      - name: Helper launch proof
        env:
          AXIS_RUN_PRIVILEGED_E2E: "1"
          AXIS_REQUIRE_NETNS_HELPER_E2E: "1"
          AXIS_REQUIRE_BUILT_AXIS_PROXY_E2E: "1"
          AXIS_REQUIRE_KMSG_AUDIT_E2E: "1"
          AXIS_PROVISION_KMSG_AUDIT_E2E: "1"
          AXIS_EXPECT_MXC_EXECUTOR: /usr/bin/lxc-exec
          AXIS_MXC_EXECUTOR_BUILD: ${{ github.workspace }}/target/release/lxc-exec
        run: |
          bash e2e/linux/test_netns_helper_launch.sh --self-test
          executor=/usr/bin/lxc-exec
          ci_bounded_sudo() {
            timeout --kill-after=1s 7s sudo -n \
              timeout --kill-after=1s 5s "$@"
          }
          status=0
          ci_bounded_sudo test -e "$executor" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "refusing to overwrite preexisting CI executor: $executor" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "failed or timed out checking CI executor path: $executor" >&2
            exit "$status"
          fi
          status=0
          ci_bounded_sudo test -L "$executor" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "refusing to overwrite preexisting CI executor symlink: $executor" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "failed or timed out checking CI executor symlink: $executor" >&2
            exit "$status"
          fi
          bash e2e/linux/test_netns_helper_launch.sh

      - name: Restore helper user namespace restriction
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          state="$RUNNER_TEMP/axis-netns-helper-apparmor-userns"
          if [ -f "$state" ]; then
            timeout --kill-after=1s 7s sudo -n timeout --kill-after=1s 5s sysctl -q -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$state")"
            rm -f "$state"
          fi

  test-windows:
    name: Test (Windows native)
    needs: changes
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Build
        run: cargo build --locked --release

      - name: Build pinned MXC Windows executor
        shell: pwsh
        run: |
          $mxcDir = Join-Path $env:RUNNER_TEMP "mxc"
          git clone --filter=blob:none $env:MXC_REPOSITORY $mxcDir
          git -C $mxcDir checkout $env:MXC_REF
          Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "third_party\mxc\patches\*.patch") |
            Sort-Object Name | ForEach-Object { git -C $mxcDir apply --whitespace=error $_.FullName }
          Push-Location (Join-Path $mxcDir "src")
          cargo build --release -p wxc --no-default-features --locked
          Pop-Location
          Copy-Item (Join-Path $mxcDir "src\target\release\wxc-exec.exe") target\release\wxc-exec.exe

      - name: Unit tests
        run: cargo test --locked

      - name: Policy validation
        run: |
          .\target\release\axis.exe policy validate policies\minimal.yaml
          .\target\release\axis.exe policy validate policies\coding-agent.yaml
          .\target\release\axis.exe policy validate policies\gpu-agent.yaml

      - name: Assemble and install Windows release archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $packageRoot = Join-Path $env:RUNNER_TEMP "axis-windows-x86_64"
          New-Item -ItemType Directory -Path $packageRoot -Force | Out-Null
          Copy-Item target\release\axis.exe,target\release\axisd.exe $packageRoot
          Copy-Item policies\*.yaml $packageRoot
          Copy-Item README.md,LICENSE,install.ps1 $packageRoot

          $archive = Join-Path $env:RUNNER_TEMP "axis-windows-x86_64.zip"
          $zip = [System.IO.Compression.ZipFile]::Open(
            $archive,
            [System.IO.Compression.ZipArchiveMode]::Create
          )
          try {
            Get-ChildItem -LiteralPath $packageRoot -File -Recurse | Sort-Object FullName | ForEach-Object {
              $relative = "axis-windows-x86_64/" +
                [System.IO.Path]::GetRelativePath($packageRoot, $_.FullName).Replace('\', '/')
              $entry = $zip.CreateEntry($relative, [System.IO.Compression.CompressionLevel]::Optimal)
              $entry.LastWriteTime = [System.DateTimeOffset]::new(1980, 1, 1, 0, 0, 0, [TimeSpan]::Zero)
              $input = [System.IO.File]::OpenRead($_.FullName)
              $output = $entry.Open()
              try { $input.CopyTo($output) } finally { $output.Dispose(); $input.Dispose() }
            }
          } finally {
            $zip.Dispose()
          }

          $archiveName = [System.IO.Path]::GetFileName($archive)
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$archive.sha256" -NoNewline -Value "$hash  $archiveName`n"
          $env:AXIS_INSTALL_ARCHIVE = $archive
          $env:AXIS_INSTALL_SHA256 = "$archive.sha256"
          $env:AXIS_DIR = Join-Path $env:RUNNER_TEMP "axis-installed"
          & .\install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $env:AXIS_DIR "axis.exe") --version
          if (-not (Test-Path -LiteralPath (Join-Path $env:AXIS_DIR "axisd.exe"))) {
            throw "axisd.exe was not installed"
          }

      - name: Reject invalid Windows installer checksums
        shell: pwsh
        run: .\scripts\test_installers.ps1

      - name: PowerShell installer bounded output tests
        shell: pwsh
        run: python -m unittest scripts.test_installers.PowerShellInstallerTests

      - name: Agent policy validation
        run: |
          Get-ChildItem policies\agents\*.yaml | ForEach-Object {
            .\target\release\axis.exe policy validate $_.FullName
          }
        shell: pwsh

      - name: Agent safety tests
        run: powershell -ExecutionPolicy Bypass -File e2e\agents\test_agents.ps1 -AxisBin .\target\release\axis.exe
        shell: pwsh

      - name: Windows MXC ProcessContainer smoke and security tests
        shell: pwsh
        env:
          AXIS_RUN_MXC_BASECONTAINER_E2E: "1"
          AXIS_SKIP_UNAVAILABLE_MXC_BASECONTAINER_E2E: "1"
          AXIS_TEST_MXC_EXECUTOR: ${{ github.workspace }}\target\release\wxc-exec.exe
        run: pwsh -NoProfile -File e2e/windows/test_mxc_processcontainer.ps1 -AxisBin ./target/release/axis.exe

      - name: Test agent install (PowerShell)
        run: |
          # Test axis install --list
          .\target\release\axis.exe install --list

          # Test install.ps1 syntax (parse check)
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content e2e\agents\install_agents.ps1 -Raw), [ref]$null
          )
          Write-Host "install_agents.ps1 syntax: OK"

          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -ne 0) {
            $parseErrors | Format-List | Out-String | Write-Error
          }
          Write-Host "install.ps1 syntax: OK"

          # Test install.ps1 runs with -List
          powershell -ExecutionPolicy Bypass -File e2e\agents\install_agents.ps1 -List

          # Test install aider (python available on GH runners)
          .\target\release\axis.exe install aider
          if (Test-Path "$env:LOCALAPPDATA\axis\bin\aider.cmd") {
            Write-Host "PASS: aider wrapper created"
          } else {
            Write-Host "FAIL: aider wrapper not found"
            exit 1
          }
        shell: pwsh

  publication-gate:
    name: CI publication gate
    needs:
      - format
      - gui-release-validation
      - clippy
      - changes
      - test-linux
      - test-macos
      - test-linux-netns-helper
      - test-windows
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every publication CI job to succeed
        env:
          FORMAT_RESULT: ${{ needs.format.result }}
          GUI_RESULT: ${{ needs.gui-release-validation.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINUX_RESULT: ${{ needs.test-linux.result }}
          MACOS_RESULT: ${{ needs.test-macos.result }}
          NETNS_RESULT: ${{ needs.test-linux-netns-helper.result }}
          WINDOWS_RESULT: ${{ needs.test-windows.result }}
        run: |
          set -euo pipefail
          for result in "$FORMAT_RESULT" "$GUI_RESULT" "$CLIPPY_RESULT" \
            "$CHANGES_RESULT" "$LINUX_RESULT" "$MACOS_RESULT" \
            "$NETNS_RESULT" "$WINDOWS_RESULT"; do
            test "$result" = success
          done
