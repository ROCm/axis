version: 1
name: vxn

# The vxn provider runs the command inside a Xen DomU (VM isolation -- separate
# kernel, not just namespaces). Selected by `axis run --policy vxn -- <tool>`.
#
# Network is ALLOWED so interactive agents work out of the box (e.g. claude's
# OAuth login + API). For a no-egress run, use a file policy with
# `network.mode: block`. `proxy` (managed inference) is not yet enforced by the
# vxn backend and fails closed.
runtime:
  provider: vxn

# NOTE: for vxn these are not host-fs Landlock rules -- the agent runs against
# the DomU's own rootfs, so the VM boundary already denies the host fs. Concrete
# paths are passed to the guest (--policy-b64) as a bind-mount view for vxn's
# guest init to apply; AXIS does not verify that it did. The {workspace} and
# {tmpdir} placeholders cannot be mapped into the DomU yet, so a rule using one
# is skipped silently under filesystem.compatibility: best_effort (the default)
# and rejected under hard_requirement. The view is not tamper-resistant until
# in-guest seccomp lands. See docs/vxn-integration.md.
filesystem:
  read_only:
    - /usr
    - /lib
    - /lib64
  read_write:
    - "{workspace}"

process:
  max_processes: 0
  max_memory_mb: 0
  cpu_rate_percent: 0

network:
  mode: allow
