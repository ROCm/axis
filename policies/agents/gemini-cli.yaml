version: 1
name: agent-gemini-cli

filesystem:
  read_only:
    - /usr
    - /lib
    - /lib64
    - /bin
    - /sbin
    - /etc
    - /System
    - /Library
    - /Applications
  read_write:
    - "{workspace}"
    - "{tmpdir}"
    - "~/.axis/agents/agent-gemini-cli/xdg-config"
    - "~/.gemini"
  deny:
    - "~/.config"
    - "~/.ssh"
    - "~/.gnupg"
    - "~/.aws"
    - "~/.kube"
    - "~/.docker"

process:
  max_processes: 0
  max_memory_mb: 16384
  cpu_rate_percent: 0
  timeout_sec: 600

network:
  mode: proxy
  policies:
    - name: google
      endpoints:
        - host: "generativelanguage.googleapis.com"
          port: 443
        - host: "accounts.google.com"
          port: 443
        - host: "oauth2.googleapis.com"
          port: 443
        - host: "aistudio.google.com"
          port: 443
    - name: telemetry
      endpoints:
        - host: "cloudtrace.googleapis.com"
          port: 443
    - name: github
      endpoints:
        - host: "api.github.com"
          port: 443
        - host: "github.com"
          port: 443
    - name: packages
      endpoints:
        - host: "registry.npmjs.org"
          port: 443
        - host: "pypi.org"
          port: 443
        - host: "files.pythonhosted.org"
          port: 443
