version: 1
name: gpu-agent-sandbox

filesystem:
  read_only:
    - /usr
    - /lib
    - /lib64
    - /etc/ssl/certs
  read_write:
    - "{workspace}"
    - "{tmpdir}"
  deny:
    - "~/.ssh"

process:
  max_processes: 64
  max_memory_mb: 16384
  cpu_rate_percent: 90

network:
  mode: proxy
  policies:
    - name: inference-local
      endpoints:
        - host: "inference.local"
          port: 443
          access: read-write

# The HIP Remote worker does not enforce VRAM limits, compute timeouts, HIP API
# allow/deny lists, or Unix-socket transport yet, so AXIS rejects GPU-enabled
# policies that request them. Only device selection over TCP is set here.
gpu:
  enabled: true
  device: 0
  transport: tcp

inference:
  default_provider: local-rocm
  routes:
    - name: local-rocm
      endpoint: "http://localhost:8080"
      model: "llama-4-scout-109b"
