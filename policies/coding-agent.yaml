version: 1
name: coding-agent-sandbox

filesystem:
  read_only:
    - /usr
    - /lib
    - /lib64
    - /etc/ssl/certs
    - /etc/resolv.conf
  read_write:
    - "{workspace}"
    - "{tmpdir}"
  deny:
    - "~/.ssh"
    - "~/.gnupg"
    - "~/.aws"
  compatibility: best_effort

process:
  max_processes: 32
  max_memory_mb: 8192
  cpu_rate_percent: 80
  blocked_syscalls:
    - ptrace
    - mount
    - bpf
    - io_uring_setup

network:
  mode: proxy
  # Endpoint rules that name binaries need connect-time attribution. On Linux
  # the automatic provider therefore selects the native backend; an explicit
  # runtime.provider: mxc rejects these rules.
  policies:
    - name: github
      endpoints:
        - host: "api.github.com"
          port: 443
          access: read-write
        - host: "github.com"
          port: 443
          access: read-write
      binaries:
        - path: "/usr/bin/git"
        - path: "/usr/bin/curl"
        - path: "*/python*"

    - name: pypi
      endpoints:
        - host: "pypi.org"
          port: 443
          access: read-write
        - host: "files.pythonhosted.org"
          port: 443
          access: read-write
      binaries:
        - path: "*/python*"
        - path: "*/pip*"

    - name: inference-local
      endpoints:
        - host: "inference.local"
          port: 443
          access: read-write

inference:
  default_provider: local-rocm
  routes:
    - name: local-rocm
      endpoint: "http://localhost:8080"
      protocols: [openai_chat_completions, model_discovery]
      model: "llama-4-scout-109b"
  token_budget:
    max_tokens_per_hour: 500000
    max_tokens_per_request: 32768
    action_on_exhaust: reject

amd:
  gpu_passthrough: true
  npu_policy_offload: false
  apex_memory_policy:
    allow_overcommit: true
    max_vram_mb: 16384
