[package]
name = "axis-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AXIS daemon (axisd) — sandbox lifecycle manager"
repository.workspace = true

[package.metadata.deb]
name = "axis"
maintainer = "AMD <noreply@amd.com>"
copyright = "2026 Advanced Micro Devices, Inc."
depends = "$auto, bubblewrap"
# MXC Bubblewrap allow and proxy network modes; AXIS checks for the tools
# before launch and rejects those policies when they are missing.
recommends = "iptables, slirp4netns"
section = "utils"
priority = "optional"
assets = [
    ["target/release/axis", "usr/bin/", "755"],
    ["target/release/axisd", "usr/bin/", "755"],
    ["target/release/lxc-exec", "usr/bin/", "755"],
    ["target/release/axis-seccomp-launcher", "usr/libexec/axis/", "755"],
    ["../../dist/axis.service", "lib/systemd/system/", "644"],
    ["../../policies/minimal.yaml", "etc/axis/policies/", "644"],
    ["../../policies/coding-agent.yaml", "etc/axis/policies/", "644"],
    ["../../policies/gpu-agent.yaml", "etc/axis/policies/", "644"],
    ["../../LICENSE", "usr/share/doc/axis/", "644"],
]
conf-files = ["/etc/axis/policies/"]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/axis", dest = "/usr/bin/axis", mode = "755" },
    { source = "target/release/axisd", dest = "/usr/bin/axisd", mode = "755" },
    { source = "target/release/lxc-exec", dest = "/usr/bin/lxc-exec", mode = "755" },
    { source = "target/release/axis-seccomp-launcher", dest = "/usr/libexec/axis/axis-seccomp-launcher", mode = "755" },
    { source = "dist/axis.service", dest = "/lib/systemd/system/axis.service", mode = "644" },
    { source = "policies/minimal.yaml", dest = "/etc/axis/policies/minimal.yaml", mode = "644" },
    { source = "policies/coding-agent.yaml", dest = "/etc/axis/policies/coding-agent.yaml", mode = "644" },
    { source = "policies/gpu-agent.yaml", dest = "/etc/axis/policies/gpu-agent.yaml", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/axis/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
bubblewrap = "*"

# MXC Bubblewrap allow and proxy network modes; AXIS checks for the tools
# before launch and rejects those policies when they are missing.
[package.metadata.generate-rpm.recommends]
iptables = "*"
slirp4netns = "*"

[[bin]]
name = "axisd"
path = "src/main.rs"

[dependencies]
axis-core = { workspace = true }
axis-safety = { workspace = true }
axis-sandbox = { workspace = true }
axis-proxy = { workspace = true }
axis-router = { workspace = true }
axis-gpu = { workspace = true }
axis-gateway = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
notify = { workspace = true }
